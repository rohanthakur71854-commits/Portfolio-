<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rohan Thakur | Next Level UI</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}
body{
  background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  color:#fff;
  overflow-x:hidden;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:20px 50px;
  backdrop-filter:blur(10px);
}
.logo{
  font-size:24px;
  font-weight:600;
}
nav a{
  margin-left:20px;
  text-decoration:none;
  color:#fff;
  transition:0.3s;
}
nav a:hover{
  color:#00f2fe;
}
.hero{
  height:90vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.hero h1{
  font-size:50px;
  background:linear-gradient(90deg,#00f2fe,#4facfe);
  -webkit-background-clip:text;
  color:transparent;
}
.hero p{
  margin-top:15px;
  font-size:18px;
  opacity:0.8;
}
.btn{
  margin-top:20px;
  padding:12px 25px;
  border:none;
  border-radius:30px;
  background:linear-gradient(90deg,#00f2fe,#4facfe);
  color:#000;
  font-weight:bold;
  cursor:pointer;
  transition:0.3s;
}
.btn:hover{
  transform:scale(1.1);
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;
  padding:50px;
}
.card{
  background:rgba(255,255,255,0.1);
  border-radius:20px;
  padding:20px;
  backdrop-filter:blur(10px);
  transition:0.3s;
}
.card:hover{
  transform:translateY(-10px);
}
footer{
  text-align:center;
  padding:20px;
  opacity:0.7;
}
</style>
</head>
<body>
<header>
  <div class="logo">Rohan UI</div>
  <nav>
    <a href="#">Home</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
  </nav>
</header>
<section class="hero">
  <div>
    <h1>Welcome Rohan Thakur</h1>
    <p>Next Level UI/UX Experience</p>
    <button class="btn">Explore</button>
  </div>
</section>
<section class="cards">
  <div class="card">
    <h2>🔥 Modern Design</h2>
    <p>Clean, futuristic glassmorphism UI.</p>
  </div>
  <div class="card">
    <h2>⚡ Fast Performance</h2>
    <p>Optimized for speed and smooth UX.</p>
  </div>
  <div class="card">
    <h2>🎯 Responsive</h2>
    <p>Works perfectly on all devices.</p>
  </div>
</section>
<footer>
  © 2026 Rohan Thakur | Built with ❤️
</footer>
</body>
</html>
